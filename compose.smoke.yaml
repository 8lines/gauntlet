services:
  gauntlet:
    build:
      context: .
      target: runtime
    environment:
      GAUNTLET_CONFIG_FILE: /etc/gauntlet/config.yaml
      GAUNTLET_HOST: "0.0.0.0"
      GAUNTLET_PORT: "8080"
    ports:
      - target: 8080
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - adapter-network
      - ingress-network
    depends_on:
      fake-adapter-a:
        condition: service_healthy
      fake-adapter-b:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./conformance/smoke/gauntlet.config.yaml
        target: /etc/gauntlet/config.yaml
        read_only: true
        bind:
          create_host_path: false
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/ready', { signal: AbortSignal.timeout(1500) }).then((response) => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  fake-adapter-a:
    build:
      context: .
      target: smoke-adapter
    expose:
      - "8081"
    networks:
      - adapter-network
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck: &adapter-healthcheck
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8081/_gauntlet/v1/health', { signal: AbortSignal.timeout(1500) }).then((response) => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  fake-adapter-b:
    build:
      context: .
      target: smoke-adapter
    expose:
      - "8081"
    networks:
      - adapter-network
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck: *adapter-healthcheck

networks:
  adapter-network:
    internal: true
  ingress-network:
    internal: false
