replicaCount: 1

image:
  repository: ghcr.io/8lines/gauntlet
  tag: "0.1.3"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

config:
  version: 1
  instance:
    name: ""
    environment:
      name: ""
      kind: ""
  targets: []

mcp:
  enabled: false
  allowedOrigins: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

networkPolicy:
  enabled: false
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  ingressPeers: []
  egressRules: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
