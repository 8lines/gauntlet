apiVersion: v1
kind: Service
metadata:
  name: {{ include "gauntlet.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "gauntlet.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gauntlet.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
