apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gauntlet.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "gauntlet.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gauntlet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gauntlet.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gauntlet
          image: {{ include "gauntlet.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GAUNTLET_HOST
              value: "0.0.0.0"
            - name: GAUNTLET_PORT
              value: "8080"
            - name: GAUNTLET_CONFIG_FILE
              value: "/etc/gauntlet/config.yaml"
            - name: GAUNTLET_MCP_ENABLED
              value: {{ .Values.mcp.enabled | quote }}
            - name: GAUNTLET_MCP_ALLOWED_ORIGINS_JSON
              value: {{ .Values.mcp.allowedOrigins | toJson | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gauntlet
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: config
          configMap:
            name: {{ include "gauntlet.fullname" . }}
            defaultMode: 292
            items:
              - key: config.yaml
                path: config.yaml
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
