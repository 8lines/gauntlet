name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read


concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ["24.20.0", "25.9.0", "26.8.1"]
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Pin pnpm's store and copy import method in its global config
        # The skill-evaluation fixtures accept only regular files with one link, and
        # release verification strips the environment (including the variables that
        # locate the store), so both settings live in pnpm's global config.
        run: |
          store="$(pnpm store path)"
          for directory in "$HOME/.config/pnpm" "${XDG_CONFIG_HOME:-$HOME/.config}/pnpm"; do
            mkdir -p "$directory"
            printf 'packageImportMethod: copy\nstoreDir: %s\n' "$store" > "$directory/config.yaml"
          done
      - run: pnpm install --frozen-lockfile --package-import-method=copy
      - run: pnpm verify:protocol-sdk --node-only

  php:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - name: Pin pnpm's store and copy import method in its global config
        # The skill-evaluation fixtures accept only regular files with one link, and
        # release verification strips the environment (including the variables that
        # locate the store), so both settings live in pnpm's global config.
        run: |
          store="$(pnpm store path)"
          for directory in "$HOME/.config/pnpm" "${XDG_CONFIG_HOME:-$HOME/.config}/pnpm"; do
            mkdir -p "$directory"
            printf 'packageImportMethod: copy\nstoreDir: %s\n' "$store" > "$directory/config.yaml"
          done
      - run: pnpm install --frozen-lockfile --package-import-method=copy
      - run: pnpm test:php:compatibility

  java:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 70
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Pin pnpm's store and copy import method in its global config
        # The skill-evaluation fixtures accept only regular files with one link, and
        # release verification strips the environment (including the variables that
        # locate the store), so both settings live in pnpm's global config.
        run: |
          store="$(pnpm store path)"
          for directory in "$HOME/.config/pnpm" "${XDG_CONFIG_HOME:-$HOME/.config}/pnpm"; do
            mkdir -p "$directory"
            printf 'packageImportMethod: copy\nstoreDir: %s\n' "$store" > "$directory/config.yaml"
          done
      - run: pnpm install --frozen-lockfile --package-import-method=copy
      - run: pnpm test:java:release

  conformance:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - name: Pin pnpm's store and copy import method in its global config
        # The skill-evaluation fixtures accept only regular files with one link, and
        # release verification strips the environment (including the variables that
        # locate the store), so both settings live in pnpm's global config.
        run: |
          store="$(pnpm store path)"
          for directory in "$HOME/.config/pnpm" "${XDG_CONFIG_HOME:-$HOME/.config}/pnpm"; do
            mkdir -p "$directory"
            printf 'packageImportMethod: copy\nstoreDir: %s\n' "$store" > "$directory/config.yaml"
          done
      - run: pnpm install --frozen-lockfile --package-import-method=copy
      - run: pnpm verify:official-adapters

  deployment:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - name: Pin pnpm's store and copy import method in its global config
        # The skill-evaluation fixtures accept only regular files with one link, and
        # release verification strips the environment (including the variables that
        # locate the store), so both settings live in pnpm's global config.
        run: |
          store="$(pnpm store path)"
          for directory in "$HOME/.config/pnpm" "${XDG_CONFIG_HOME:-$HOME/.config}/pnpm"; do
            mkdir -p "$directory"
            printf 'packageImportMethod: copy\nstoreDir: %s\n' "$store" > "$directory/config.yaml"
          done
      - run: pnpm install --frozen-lockfile --package-import-method=copy
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: node scripts/prepare-ci-images.mjs
      - run: pnpm test:image
      - run: pnpm test:compose:distribution
      - run: pnpm smoke:compose
      - run: pnpm test:helm

  security:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - name: Mount binfmt_misc so QEMU registrations outlive the installer container
        run: mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          cache-binary: false
      - name: Pin pnpm's store and copy import method in its global config
        # The skill-evaluation fixtures accept only regular files with one link, and
        # release verification strips the environment (including the variables that
        # locate the store), so both settings live in pnpm's global config.
        run: |
          store="$(pnpm store path)"
          for directory in "$HOME/.config/pnpm" "${XDG_CONFIG_HOME:-$HOME/.config}/pnpm"; do
            mkdir -p "$directory"
            printf 'packageImportMethod: copy\nstoreDir: %s\n' "$store" > "$directory/config.yaml"
          done
      - run: pnpm install --frozen-lockfile --package-import-method=copy
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: node scripts/prepare-ci-images.mjs
      - name: Build release package inputs
        run: pnpm build
      - name: Stage the exact security input
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          pnpm release:stage --output "$PWD/.artifacts/release/$VERSION"
      - name: Run the full release security gate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          pnpm release:security --image-archive ".artifacts/release/$VERSION/image/gauntlet-$VERSION.docker.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tagged-security-reports
          path: .artifacts/security
          if-no-files-found: error
          retention-days: 30

  release-metadata:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - name: Mount binfmt_misc so QEMU registrations outlive the installer container
        run: mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          cache-binary: false
      - name: Pin pnpm's store and copy import method in its global config
        # The skill-evaluation fixtures accept only regular files with one link, and
        # release verification strips the environment (including the variables that
        # locate the store), so both settings live in pnpm's global config.
        run: |
          store="$(pnpm store path)"
          for directory in "$HOME/.config/pnpm" "${XDG_CONFIG_HOME:-$HOME/.config}/pnpm"; do
            mkdir -p "$directory"
            printf 'packageImportMethod: copy\nstoreDir: %s\n' "$store" > "$directory/config.yaml"
          done
      - run: pnpm install --frozen-lockfile --package-import-method=copy
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: node scripts/prepare-ci-images.mjs
      - run: pnpm --filter @8lines/gauntlet-dashboard exec playwright install --with-deps chromium
      - name: Verify immutable tagged source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node scripts/release/version.mjs --check --tag "$GITHUB_REF_NAME"
      - name: Build release package inputs
        run: pnpm build
      - run: pnpm release:dry-run
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium

  publish:
    needs: [node, php, java, conformance, deployment, security, release-metadata]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@8lines"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Mount binfmt_misc so QEMU registrations outlive the installer container
        run: mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          cache-binary: false
      - name: Pin pnpm's store and copy import method in its global config
        # The skill-evaluation fixtures accept only regular files with one link, and
        # release verification strips the environment (including the variables that
        # locate the store), so both settings live in pnpm's global config.
        run: |
          store="$(pnpm store path)"
          for directory in "$HOME/.config/pnpm" "${XDG_CONFIG_HOME:-$HOME/.config}/pnpm"; do
            mkdir -p "$directory"
            printf 'packageImportMethod: copy\nstoreDir: %s\n' "$store" > "$directory/config.yaml"
          done
      - run: pnpm install --frozen-lockfile --package-import-method=copy
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: node scripts/prepare-ci-images.mjs
      - run: pnpm --filter @8lines/gauntlet-dashboard exec playwright install --with-deps chromium
      - name: Build release package inputs
        run: pnpm build
      - name: Reproduce and verify staged release
        shell: bash
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node scripts/release/version.mjs --check --tag "$GITHUB_REF_NAME"
          pnpm release:dry-run
      - name: Authenticate GitHub container registry pushes
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Check every remote destination
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GAUNTLET_USE_REMOTE_RECEIPT: "true"
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          RESULT="$RUNNER_TEMP/gauntlet-published-state.json"
          node scripts/release/check-published.mjs \
            --release-directory "$PWD/.artifacts/release/$VERSION" \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" > "$RESULT"
          STATE="$(node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!["clean","already-identical"].includes(value.state))process.exit(1);process.stdout.write(value.state)' "$RESULT")"
          printf 'state=%s\n' "$STATE" >> "$GITHUB_OUTPUT"
      - name: Publish commit-tagged image with attestations
        if: steps.preflight.outputs.state == 'clean'
        id: image-copy
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          RELEASE_DIRECTORY="$PWD/.artifacts/release/$VERSION"
          SKOPEO_IMAGE="quay.io/skopeo/stable:v1.20.0@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4"
          DIGEST_DIRECTORY="$(mktemp -d "$RUNNER_TEMP/gauntlet-image-copy.XXXXXXXX")"
          DIGEST_FILE="$DIGEST_DIRECTORY/digest"
          # Run as the runner's user: the staged archives and the registry login are
          # 0600 files that root cannot read once every capability is dropped.
          # Skopeo unpacks the OCI archive under /var/tmp, so it gets its own tmpfs.
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --network bridge \
            --mount "type=bind,src=$HOME/.docker,dst=/docker-config,readonly" \
            --mount "type=bind,src=$RELEASE_DIRECTORY/image,dst=/release,readonly" \
            --mount "type=bind,src=$DIGEST_DIRECTORY,dst=/output" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777 \
            --tmpfs /var/tmp:rw,noexec,nosuid,nodev,size=4294967296,mode=1777 \
            "$SKOPEO_IMAGE" copy --all --preserve-digests \
            --authfile /docker-config/config.json \
            --digestfile /output/digest \
            "oci-archive:/release/gauntlet-$VERSION.oci.tar" \
            "docker://ghcr.io/8lines/gauntlet:sha-$SHORT_SHA"
          DIGEST="$(tr -d '\n' < "$DIGEST_FILE")"
          test "${DIGEST#sha256:}" != "$DIGEST"
          test "${#DIGEST}" -eq 71
          rm -- "$DIGEST_FILE"
          rmdir -- "$DIGEST_DIRECTORY"
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Verify pushed image and attestations
        if: steps.preflight.outputs.state == 'clean'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          IMAGE="ghcr.io/8lines/gauntlet:sha-$SHORT_SHA"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          test "${DIGEST#sha256:}" != "$DIGEST"
          test "${#DIGEST}" -eq 71
          test "$DIGEST" = "${{ steps.image-copy.outputs.digest }}"
          test "$(docker buildx imagetools inspect "ghcr.io/8lines/gauntlet@$DIGEST" --format '{{ json .Provenance }}')" != "null"
          test "$(docker buildx imagetools inspect "ghcr.io/8lines/gauntlet@$DIGEST" --format '{{ json .SBOM }}')" != "null"
          TRIVY_IMAGE="aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e"
          for PLATFORM in linux/amd64 linux/arm64; do
            docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" \
              --network bridge \
              --env DOCKER_CONFIG=/docker-config \
              --env HOME=/tmp/home \
              --env TRIVY_CACHE_DIR=/tmp/trivy-cache \
              --mount "type=bind,src=$HOME/.docker,dst=/docker-config,readonly" \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2147483648,mode=1777 \
              "$TRIVY_IMAGE" \
              --cache-dir /tmp/trivy-cache --quiet --timeout 5m0s \
              image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln \
              --ignore-unfixed --skip-version-check --platform "$PLATFORM" \
              "ghcr.io/8lines/gauntlet@$DIGEST"
          done
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Promote image digest to the semantic tag
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          docker buildx imagetools create \
            --tag "ghcr.io/8lines/gauntlet:$VERSION" \
            "ghcr.io/8lines/gauntlet@${{ steps.image.outputs.digest }}"
      - name: Publish Helm chart
        if: steps.preflight.outputs.state == 'clean'
        id: chart
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          HELM_RESULT="$RUNNER_TEMP/gauntlet-helm-push.txt"
          # Helm reports "Pushed:" and "Digest:" on stderr.
          helm push ".artifacts/release/$VERSION/helm/gauntlet-$VERSION.tgz" oci://ghcr.io/8lines/charts 2>&1 | tee "$HELM_RESULT"
          DIGEST="$(sed -n 's/^Digest:[[:space:]]*//p' "$HELM_RESULT" | tail -n 1)"
          test "${DIGEST#sha256:}" != "$DIGEST"
          test "${#DIGEST}" -eq 71
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Publish staged npm packages
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          for PACKAGE in ".artifacts/release/$VERSION/npm/"*.tgz; do
            npm publish "$PACKAGE" --registry=https://registry.npmjs.org/ --access public --provenance
          done
      - name: Publish staged Maven packages
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          ORG_GRADLE_PROJECT_gauntletRemotePublishing: "true"
          ORG_GRADLE_PROJECT_gauntletRemoteUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gauntletRemotePassword: ${{ github.token }}
        run: |
          set -euo pipefail
          packages/java/gradlew --no-daemon --no-configuration-cache --console=plain \
            -p packages/java :core:publish :spring-boot-starter:publish
      - name: Publish Composer split repositories
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          COMPOSER_SPLIT_CORE_DEPLOY_KEY: ${{ secrets.COMPOSER_SPLIT_CORE_DEPLOY_KEY }}
          COMPOSER_SPLIT_BUNDLE_DEPLOY_KEY: ${{ secrets.COMPOSER_SPLIT_BUNDLE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          node scripts/release/publish-composer.mjs \
            --release-directory "$PWD/.artifacts/release/$VERSION" \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA"
      - name: Verify every published artifact
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GAUNTLET_EXPECTED_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          node scripts/release/check-published.mjs \
            --release-directory "$PWD/.artifacts/release/$VERSION" \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --require-identical
      - name: Write publication receipt and checksums
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          RELEASE_DIRECTORY="$PWD/.artifacts/release/$VERSION"
          node scripts/release/check-published.mjs \
            --finalize "$RELEASE_DIRECTORY" \
            --image-digest "$IMAGE_DIGEST" \
            --chart-digest "$CHART_DIGEST"
      - name: Create draft GitHub Release
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          RELEASE_DIRECTORY="$PWD/.artifacts/release/$VERSION"
          gh release create "v$VERSION" \
            --draft \
            --verify-tag \
            --title "Gauntlet v$VERSION" \
            --generate-notes \
            "$RELEASE_DIRECTORY/compose/gauntlet-compose-$VERSION.tar.gz" \
            "$RELEASE_DIRECTORY/release-manifest.json" \
            "$RELEASE_DIRECTORY/publication-receipt.json" \
            "$RELEASE_DIRECTORY/SHA256SUMS" \
            "$RELEASE_DIRECTORY/skills/gauntlet-skills-$VERSION.tgz" \
            "$RELEASE_DIRECTORY/helm/gauntlet-$VERSION.tgz" \
            "$RELEASE_DIRECTORY/image/gauntlet-$VERSION.provenance.json" \
            "$RELEASE_DIRECTORY/sbom/gauntlet-linux-amd64.spdx.json" \
            "$RELEASE_DIRECTORY/sbom/gauntlet-linux-arm64.spdx.json"
      - name: Verify draft GitHub Release assets byte-for-byte
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          node scripts/release/check-published.mjs \
            --release-directory "$PWD/.artifacts/release/$VERSION" \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --require-draft-identical
      - name: Publish verified GitHub Release
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          gh release edit "v$VERSION" --draft=false
      - name: Verify immutable GitHub Release assets byte-for-byte
        if: steps.preflight.outputs.state == 'clean'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GAUNTLET_EXPECTED_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          GAUNTLET_EXPECTED_CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          GAUNTLET_USE_REMOTE_RECEIPT: "true"
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          node scripts/release/check-published.mjs \
            --release-directory "$PWD/.artifacts/release/$VERSION" \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --require-identical
