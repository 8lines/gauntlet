      ${a.phrase?`<div class="border-t border-border pt-5"><label class="text-[13px] font-medium">Type “${a.phrase}” to confirm</label>
        <input class="mt-1.5 w-full rounded-md border-input text-[13px]" placeholder="${a.phrase}"></div>`:''}
      <details class="rounded-md border border-border"><summary class="cursor-pointer px-3 py-2 text-[12px] font-medium text-sub hover:text-fg">Technical details</summary>
        <dl class="grid grid-cols-[110px_minmax(0,1fr)] gap-y-1.5 border-t border-border px-3 py-2.5 font-mono text-[11px]">
          ${Object.entries(a.tech).map(([x,y])=>`<dt class="text-sub">${x}</dt><dd class="break-all">${y}</dd>`).join('')}</dl></details>
    </div>
    <div class="flex items-center gap-2 border-t border-border px-5 py-4">
      ${button('Cancel','data-close="1"')}<span class="flex-1"></span>
      ${button(a.cta,'data-run="1"', a.destructive?'destructive':'primary')}</div>`;
}
function showResult() {
  const a = OPERATIONS[state.active], r = a.result;
  if (EFFECTS[state.active]) { try { EFFECTS[state.active](DETAILS[state.id]); render(); } catch(e){ console.warn('effect', state.active, e); } }
  el('sheet').innerHTML = `
    <div class="flex items-start gap-3 border-b border-border px-5 py-4">
      <div class="min-w-0 flex-1">${badge('ok','✓ Done')}
        <h2 class="mt-2 text-[16px] font-semibold tracking-tight">${r.title}</h2></div>
      <button data-close="1" class="rounded-md px-2 py-1 text-sub hover:bg-soft">✕</button></div>
    <div class="flex-1 space-y-5 overflow-y-auto px-5 py-5">
      <ul class="space-y-1.5">${r.lines.map(l=>`<li class="text-[13px]">${l}</li>`).join('')}</ul>
      ${r.file?`<div class="flex items-center gap-3 rounded-md border border-border px-3 py-2.5">
        <span class="rounded bg-soft px-1.5 py-1 text-[10px] font-semibold text-sub">PDF</span>
        <span class="flex-1 font-mono text-[12px]">${r.file}</span>
        <button class="text-[12px] font-medium text-info hover:underline">Download</button></div>`:''}
      ${r.launch?`<div class="rounded-md border border-dashed border-info-bd bg-info-bg p-4">
        <p class="text-[13px] font-medium text-info">${r.launch}</p>
        <div class="mt-2.5">${button('Open in a new tab ↗','','primary')}</div></div>`:''}
      <div class="border-t border-border pt-5"><p class="text-[12px] font-semibold uppercase tracking-wide text-sub">What next</p>
        <div class="mt-2.5 space-y-2">${r.next.map(n=>
          `<button data-close="1" class="w-full rounded-md border border-border px-3 py-2 text-left text-[13px] hover:bg-soft">${n}</button>`).join('')}</div></div>
    </div>
    <div class="flex border-t border-border px-5 py-4"><span class="flex-1"></span>${button('Close','data-close="1"','primary')}</div>`;
  el('toast').textContent = r.title; el('toast').hidden = false;
  clearTimeout(window.__t); window.__t = setTimeout(()=>{ el('toast').hidden = true; }, 2600);
}
const closePanel = () => { el('sheet').hidden = true; el('scrim').hidden = true; state.active = null; };

/* ===================== MOBILE NAVIGATION + EVENTS ===================== */
const openNav = () => { el('sidebar').classList.remove('-translate-x-full'); el('navscrim').hidden = false; };
const closeNav = () => { el('sidebar').classList.add('-translate-x-full'); el('navscrim').hidden = true; };

document.addEventListener('click', e => {
  if (e.target === el('scrim')) return closePanel();
  if (e.target === el('navscrim')) return closeNav();
  if (e.target.closest('#burger')) return openNav();
  const t = e.target.closest('[data-go],[data-open],[data-action],[data-close],[data-run]');
  if (!t) return;
  if (t.dataset.close) return closePanel();
  if (t.dataset.run) return showResult();
  if (t.dataset.action)   return openPanel(t.dataset.action);
  if (t.dataset.open)    return openDetail(t.dataset.open);
  if (t.dataset.go)      return go(t.dataset.go);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePanel(); closeNav(); } });

render();
</script>
</body>
</html>
